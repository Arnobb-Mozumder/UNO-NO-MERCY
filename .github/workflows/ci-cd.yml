name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Test Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Webpack bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated!"
            exit 1
          fi
          echo "Build verification successful."

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Dockerfile exists
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "Dockerfile not found in repository. Creating fallback Dockerfile..."
            cat << 'EOF' > Dockerfile
# Multi-stage Dockerfile for UNO No Mercy Web Application
FROM node:20-alpine AS builder
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN npm run build

FROM nginx:1.25-alpine AS runner
COPY --from=builder /app/dist /usr/share/nginx/html
EXPOSE 80
HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
  CMD wget -qO- http://localhost:80/ || exit 1
CMD ["nginx", "-g", "daemon off;"]
EOF
          fi

      - name: Build Docker Image
        run: docker build -t uno-no-mercy:latest -f Dockerfile .
